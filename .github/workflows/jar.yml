name: Publish Release JAR

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@v6.1.0
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.4.1

      - name: Build with Gradle
        run: ./gradlew bootJar -PprojectVersion=${{ github.event.release.tag_name }}

      - name: Remove unnecessary JAR file
        run: |
          rm -f build/libs/*-plain.jar
          ls build/libs

      - name: Release
        uses: softprops/action-gh-release@v3.0.3
        with:
          files: |
            build/libs/*.jar
